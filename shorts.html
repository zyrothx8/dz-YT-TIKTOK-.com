<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حرائق مرعبة اليوم في جيجل وبجاية</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .shorts-container {
      width: 100%;
      max-width: 400px;
      background-color: #1f1f1f;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }

    .thumbnail-box {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
    }

    .thumbnail-box img {
      width: 100%;
      display: block;
      border-radius: 8px;
    }

    h2 {
      font-size: 1.2rem;
      margin: 16px 0 8px 0;
    }

    p {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 20px;
    }

    .watch-btn {
      display: inline-block;
      width: 100%;
      padding: 12px 0;
      background-color: #ff0000;
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .watch-btn:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>

  <div class="shorts-container">
    <div class="thumbnail-box">
      <img src="https://img.youtube.com/vi/jIUDGnW204Y/maxresdefault.jpg" alt="حرائق جيجل وبجاية">
    </div>

    <h2>حرائق مرعبة اليوم في جيجل وبجاية</h2>
    <p>مقطع يظهر مشاهد لحرائق الغابات في ولايتي جيجل وبجاية.</p>

    <a href="https://www.youtube.com/shorts/jIUDGnW204Y" target="_blank" style="text-decoration: none;">
      <button class="watch-btn">▶ مشاهدة الشورت</button>
    </a>
  </div>

</body>
</html>
