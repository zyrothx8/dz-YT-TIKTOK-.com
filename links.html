<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZYT | روابطي</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .links-container {
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            font-size: 50px;
            font-weight: bold;
            color: #ff2020;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .description {
            color: #aaa;
            margin-bottom: 35px;
            font-size: 16px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;

            width: 100%;
            height: 65px;
            margin: 18px 0;

            background: #111;
            border: 2px solid #ff2020;
            border-radius: 12px;

            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;

            transition: 0.25s;
        }

        .link-button:hover {
            background: #ff2020;
            color: white;
            transform: scale(1.04);
            box-shadow: 0 0 25px rgba(255, 32, 32, 0.5);
        }

        .icon {
            font-size: 27px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
            transition: 0.2s;
        }

        .back:hover {
            color: #ff2020;
        }
    </style>
</head>

<body>

    <div class="links-container">

        <div class="logo">DZYT</div>

        <h1>روابطي</h1>

        <p class="description">
روابطي كل الروابط الحقيقيه
      </p>

        <!-- YouTube -->
        <a class="link-button"
           href="https://www.youtube.com/@zyrothx_pvp_dz_ar/videos"
           target="_blank">
            <span class="icon">▶</span>
            YouTube
        </a>

        <!-- Kick -->
        <a class="link-button"
           href="ضع_رابط_Kick_هنا"
           target="_blank">
            <span class="icon">🎥</span>
            Kick
        </a>

        <!-- Discord -->
        <a class="link-button"
           href="https://discord.gg/GU9Uqam8"
           target="_blank">
            <span class="icon">💬</span>
            Discord
        </a>

        <a class="back" href="index.html">
            ← العودة للرئيسية
        </a>

    </div>

</body>
</html>
