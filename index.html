<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZYROTHX MC</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #17191c 0%,
                    #0b0c0e 45%,
                    #050506 100%
                );

            color: white;
            padding: 55px 30px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 45px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .header h1 span {
            color: #ff2929;
        }

        .header p {
            color: #8b8d91;
            font-size: 19px;
        }

        /* Cards */

        .cards {
            display: flex;
            justify-content: center;
            gap: 28px;
        }

        .card {
            position: relative;

            width: 100%;
            max-width: 550px;

            min-height: 500px;

            padding: 28px;

            background:
                linear-gradient(
                    145deg,
                    #181a1d,
                    #0d0f11
                );

            border: 1px solid #292c30;
            border-radius: 18px;

            text-decoration: none;
            color: white;

            overflow: hidden;

            display: flex;
            flex-direction: column;
            align-items: center;

            transition: 0.3s ease;
        }

        /* Top red line */

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 18%;

            width: 64%;
            height: 3px;

            background: #ff2929;

            box-shadow:
                0 0 12px rgba(255, 41, 41, 0.5);
        }

        /* Hover */

        .card:hover {
            transform: translateY(-7px);

            border-color: #3a3d42;

            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.65),
                0 0 25px rgba(255, 41, 41, 0.08);
        }

        /* Icon */

        .icon {
            width: 82px;
            height: 82px;

            margin-top: 4px;
            margin-bottom: 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #0a0b0d;

            border: 1px solid #303338;

            color: #ff2929;

            font-size: 38px;

            box-shadow:
                0 0 20px rgba(255, 41, 41, 0.08);
        }

        /* Title */

        .card h2 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        /* Description */

        .card p {
            color: #85878b;

            font-size: 17px;

            line-height: 1.7;

            text-align: center;

            max-width: 430px;

            margin-bottom: 25px;
        }

        /* Preview */

        .card-preview {
            width: 100%;
            height: 150px;

            padding: 22px;

            margin-top: auto;
            margin-bottom: 20px;

            background: #08090b;

            border: 1px solid #23262a;

            border-radius: 13px;

            display: flex;
            align-items: center;

            gap: 22px;
        }

        /* Preview Icon */

        .preview-icon {
            width: 70px;
            height: 70px;

            flex-shrink: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 10px;

            background: #15171a;

            color: #ff2929;

            font-size: 30px;
        }

        /* Preview Lines */

        .preview-lines {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        .preview-lines span {
            display: block;

            height: 8px;

            border-radius: 10px;

            background: #303338;
        }

        .preview-lines span:nth-child(1) {
            width: 85%;

            background:
                linear-gradient(
                    to right,
                    #ff2929 35%,
                    #303338 35%
                );
        }

        .preview-lines span:nth-child(2) {
            width: 100%;
        }

        .preview-lines span:nth-child(3) {
            width: 65%;
        }

        /* Button */

        .card-button {
            width: 100%;
            height: 55px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111315;

            border: 1px solid #303338;

            border-radius: 9px;

            color: white;

            font-size: 17px;
            font-weight: bold;

            transition: 0.3s ease;
        }

        .card:hover .card-button {
            background: #ff2929;
            border-color: #ff2929;

            box-shadow:
                0 0 20px rgba(255, 41, 41, 0.25);
        }

        /* Mobile */

        @media (max-width: 750px) {

            body {
                padding: 35px 18px;
            }

            .header h1 {
                font-size: 34px;
            }

            .header p {
                font-size: 16px;
            }

            .cards {
                display: flex;
                justify-content: center;
            }

            .card {
                min-height: 450px;
                max-width: 550px;
            }
        }

    </style>
</head>

<body>

    <main class="container">

        <header class="header">

            <h1>
                Welcome to <span>ZYROTHX MC</span>
            </h1>

            <p>
                Explore my Minecraft content and all my social links
            </p>

        </header>

        <div class="cards">

            <!-- Links -->

            <a href="links.html" class="card">

                <div class="icon">
                    🔗
                </div>

                <h2>
                    My Links
                </h2>

                <p>
                    Find all my social media and community links in one place.
                </p>

                <div class="card-preview">

                    <div class="preview-icon">
                        🔗
                    </div>

                    <div class="preview-lines">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

                <div class="card-button">
                    View Links
                </div>

            </a>

        </div>

    </main>

</body>
</html>
