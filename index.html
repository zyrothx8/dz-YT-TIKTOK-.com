<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZYROTHX MC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1 class="main-title">
            Welcome to <span>ZYROTHX MC</span>
        </h1>

        <p class="subtitle">
            Explore my Minecraft content and all my social links
        </p>


        <div class="cards">

            <!-- DZYT Card -->
            <a href="DZYT.html" class="card">

                <div class="icon">
                    ⚔
                </div>

                <h2>
                    DZYT
                </h2>

                <p>
                    Enter the main DZYT website and explore my Minecraft content.
                </p>

                <div class="card-preview">

                    <div class="preview-icon">
                        ⚔
                    </div>

                    <div class="preview-lines">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

                <div class="card-button">
                    Enter DZYT
                </div>

            </a>


            <!-- Links Card -->
            <a href="links.html" class="card">

                <div class="icon">
                    🔗
                </div>

                <h2>
                    My Links
                </h2>

                <p>
                    Find all my social media and community links in one place.
                </p>

                <div class="card-preview">

                    <div class="preview-icon">
                        🔗
                    </div>

                    <div class="preview-lines">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

                <div class="card-button">
                    View Links
                </div>

            </a>

        </div>

    </main>

</body>
</html>
