<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZYROTHX MC</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #181a1e 0%,
                    #0b0c0e 45%,
                    #050506 100%
                );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 25px;
        }

        .container {
            width: 100%;
            max-width: 1100px;

            text-align: center;
        }

        .main-title {
            font-size: 48px;
            font-weight: 800;

            margin-bottom: 12px;
        }

        .main-title span {
            color: #ff2929;
        }

        .subtitle {
            color: #85878b;

            font-size: 19px;

            margin-bottom: 45px;
        }

        .cards {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 28px;
        }

        .card {
            position: relative;

            min-height: 500px;

            padding: 30px;

            background:
                linear-gradient(
                    145deg,
                    #17191c,
                    #0d0e10
                );

            border: 1px solid #292c30;

            border-radius: 18px;

            color: white;

            text-decoration: none;

            display: flex;
            flex-direction: column;
            align-items: center;

            overflow: hidden;

            transition: 0.3s ease;
        }

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 15%;

            width: 70%;
            height: 3px;

            background: #ff2929;

            box-shadow:
                0 0 15px rgba(255, 41, 41, 0.5);
        }

        .card:hover {
            transform: translateY(-8px);

            border-color: #ff2929;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.6),
                0 0 25px rgba(255, 41, 41, 0.12);
        }

        .icon {
            width: 80px;
            height: 80px;

            margin-top: 5px;
            margin-bottom: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #090a0c;

            border: 1px solid #303338;

            color: #ff2929;

            font-size: 36px;

            box-shadow:
                0 0 20px rgba(255, 41, 41, 0.08);
        }

        .card h2 {
            font-size: 30px;

            margin-bottom: 12px;
        }

        .card p {
            max-width: 420px;

            color: #85878b;

            font-size: 17px;

            line-height: 1.7;

            margin-bottom: 25px;
        }

        .card-preview {
            width: 100%;
            height: 145px;

            padding: 25px;

            margin-top: auto;
            margin-bottom: 20px;

            background: #08090b;

            border: 1px solid #22252a;

            border-radius: 13px;

            display: flex;
            align-items: center;

            gap: 25px;
        }

        .preview-icon {
            width: 75px;
            height: 75px;

            flex-shrink: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 10px;

            background: #15171a;

            color: #ff2929;

            font-size: 30px;
        }

        .preview-lines {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 13px;
        }

        .preview-lines span {
            display: block;

            height: 8px;

            border-radius: 10px;

            background: #303338;
        }

        .preview-lines span:first-child {
            width: 85%;

            background: linear-gradient(
                to right,
                #ff2929 35%,
                #303338 35%
            );
        }

        .preview-lines span:nth-child(2) {
            width: 100%;
        }

        .preview-lines span:nth-child(3) {
            width: 65%;
        }

        .card-button {
            width: 100%;
            height: 55px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 9px;

            background: #111315;

            border: 1px solid #303338;

            color: white;

            font-size: 17px;
            font-weight: bold;

            transition: 0.3s ease;
        }

        .card:hover .card-button {
            background: #ff2929;

            border-color: #ff2929;

            box-shadow:
                0 0 20px rgba(255, 41, 41, 0.25);
        }

        @media (max-width: 750px) {

            body {
                padding: 35px 18px;
            }

            .main-title {
                font-size: 34px;
            }

            .subtitle {
                font-size: 16px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .card {
                min-height: 450px;
            }
        }

    </style>
</head>

<body>

    <main class="container">

        <h1 class="main-title">
            Welcome to <span>ZYROTHX MC</span>
        </h1>

        <p class="subtitle">
            Explore my Minecraft content and all my social links
        </p>

        <div class="cards">

            <a href="DZYT.html" class="card">

                <div class="icon">
                    ⚔
                </div>

                <h2>
                    DZYT
                </h2>

                <p>
                    Enter the main DZYT website and explore my Minecraft content.
                </p>

                <div class="card-preview">

                    <div class="preview-icon">
                        ⚔
                    </div>

                    <div class="preview-lines">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

                <div class="card-button">
                    Enter DZYT
                </div>

            </a>


            <a href="links.html" class="card">

                <div class="icon">
                    🔗
                </div>

                <h2>
                    My Links
                </h2>

                <p>
                    Find all my social media and community links in one place.
                </p>

                <div class="card-preview">

                    <div class="preview-icon">
                        🔗
                    </div>

                    <div class="preview-lines">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

                <div class="card-button">
                    View Links
                </div>

            </a>

        </div>

    </main>

</body>
</html>
